apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: artevier
spec:
  replicas: {{ (index .Values.services "user-service").replicas }}
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: "{{ (index .Values.services "user-service").image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ (index .Values.services "user-service").targetPort }}
          envFrom:
            - secretRef:
                name: user-service-secret