apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: artevier
spec:
  replicas: {{ (index .Values.services "order-service").replicas }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ (index .Values.services "order-service").image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ (index .Values.services "order-service").targetPort }}
          envFrom:
            - secretRef:
                name: order-service-secret