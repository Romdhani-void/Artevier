apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-secret
  namespace: artevier
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: order-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: artevier/dev/order-service