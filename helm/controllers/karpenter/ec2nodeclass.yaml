apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: artevier-spot
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest

  role: artevier-eks-cluster-karpenter-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: artevier-eks-cluster

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: artevier-eks-cluster

  tags:
    karpenter.sh/discovery: artevier-eks-cluster