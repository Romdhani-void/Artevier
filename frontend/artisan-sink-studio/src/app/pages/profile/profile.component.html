<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="section-title mb-8">{{ languageService.t('profile.title') }}</h1>

  @if (message) { <div class="mb-4 p-3 bg-green-900/50 border border-green-700 text-green-300 rounded-lg">{{ message }}</div> }
  @if (error) { <div class="mb-4 p-3 bg-red-900/50 border border-red-700 text-red-300 rounded-lg">{{ error }}</div> }

  <div class="card p-6 mb-8">
    <h2 class="font-semibold text-dark-100 mb-4">{{ languageService.t('profile.personalInfo') }}</h2>
    <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.firstName') }}</label><input formControlName="firstName" class="input-field"></div>
        <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.lastName') }}</label><input formControlName="lastName" class="input-field"></div>
      </div>
      <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.email') }}</label><input [value]="auth.currentUser()?.email" disabled class="input-field opacity-60"></div>
      <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.phone') }}</label><input formControlName="phone" class="input-field"></div>
      <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.address') }}</label><textarea formControlName="address" rows="2" class="input-field"></textarea></div>
      <button type="submit" [disabled]="loading" class="btn-primary">{{ passwordLoading ? languageService.t('profile.saving') : languageService.t('profile.saveChanges') }}</button>
    </form>
  </div>

  <div class="card p-6">
    <h2 class="font-semibold text-dark-100 mb-4">{{ languageService.t('profile.changePassword') }}</h2>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="space-y-4">
      <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.currentPassword') }}</label><input type="password" formControlName="currentPassword" class="input-field"></div>
      <div><label class="block text-sm text-dark-400 mb-1">{{ languageService.t('auth.newPassword') }}</label><input type="password" formControlName="newPassword" class="input-field"></div>
      <button type="submit" [disabled]="passwordLoading" class="btn-secondary">{{ passwordLoading ? languageService.t('profile.updatingPassword') : languageService.t('profile.updatePassword') }}</button>
    </form>
  </div>
</div>
