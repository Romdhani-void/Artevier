<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="mb-6"><a routerLink="/admin/products" class="text-primary-400 text-sm hover:underline">← Back to products</a></div>
  <h1 class="section-title mb-8">{{ isEdit ? 'Edit Product' : 'Add Product' }}</h1>

  @if (error) { <div class="mb-4 p-3 bg-red-900/50 border border-red-700 text-red-300 rounded-lg">{{ error }}</div> }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card p-6 space-y-4">
    <div><label class="block text-sm text-dark-400 mb-1">Name</label><input formControlName="name" class="input-field"></div>
    <div><label class="block text-sm text-dark-400 mb-1">Description</label><textarea formControlName="description" rows="4" class="input-field"></textarea></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm text-dark-400 mb-1">Price (EUR)</label><input type="number" formControlName="price" class="input-field"></div>
      <div><label class="block text-sm text-dark-400 mb-1">Stock</label><input type="number" formControlName="stock" class="input-field"></div>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div><label class="block text-sm text-dark-400 mb-1">Material</label>
        <select formControlName="material" class="input-field"><option value="">Select</option>@for (m of materials; track m) { <option [value]="m">{{ m }}</option> }</select>
      </div>
      <div><label class="block text-sm text-dark-400 mb-1">Shape</label>
        <select formControlName="shape" class="input-field"><option value="">Select</option>@for (s of shapes; track s) { <option [value]="s">{{ s }}</option> }</select>
      </div>
      <div><label class="block text-sm text-dark-400 mb-1">Color</label><input formControlName="color" class="input-field"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm text-dark-400 mb-1">Dimensions</label><input formControlName="dimensions" class="input-field" placeholder='33" L x 22" W x 10" D'></div>
      <div><label class="block text-sm text-dark-400 mb-1">Weight</label><input formControlName="weight" class="input-field" placeholder="28 lbs"></div>
    </div>
    <div class="flex items-center gap-2">
      <input type="checkbox" formControlName="featured" id="featured" class="rounded">
      <label for="featured" class="text-dark-300">Featured product</label>
    </div>
    <div><label class="block text-sm text-dark-400 mb-1">Images</label><input type="file" multiple accept="image/*" (change)="onFileSelect($event)" class="input-field"></div>
    <button type="submit" [disabled]="form.invalid || loading" class="btn-primary w-full">{{ loading ? 'Saving...' : (isEdit ? 'Update Product' : 'Create Product') }}</button>
  </form>
</div>
